name: Build Unsigned IPA (macOS 15)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    # Usa o runner oficial do macOS 15 (ARM64, chip M1)
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode
      run: |
        # Garante que o Xcode padrão do runner está selecionado
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Create Minimal Xcode Project
      run: |
        # Cria a estrutura de pastas mínima para um projeto iOS
        mkdir -p externopolo.xcodeproj/xcshareddata/xcschemes
        
        # Move os arquivos fonte para uma pasta limpa (opcional, mas ajuda na organização)
        # Se seus arquivos já estão na raiz, o comando abaixo apenas os mantém lá.
        # O pbxproj abaixo vai referenciá-los pelo caminho relativo.
        
        # Cria o arquivo project.pbxproj
        # NOTA: Este é um projeto genérico. Ele assume que seus arquivos .m/.h
        # não dependem de frameworks externos complexos (além de UIKit/Foundation).
        cat > externopolo.xcodeproj/project.pbxproj << 'EOF'
        // !$*UTF8*$!
        {
            archiveVersion = 1;
            classes = {
            };
            objectVersion = 46;
            objects = {
        /* Begin PBXFileReference section */
                A1 /* AppDelegate.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = AppDelegate.h; sourceTree = "<group>"; };
                A2 /* AppDelegate.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = AppDelegate.m; sourceTree = "<group>"; };
                A3 /* main.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = main.m; sourceTree = "<group>"; };
                A4 /* HttpStateServer.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = HttpStateServer.h; sourceTree = "<group>"; };
                A5 /* HttpStateServer.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = HttpStateServer.m; sourceTree = "<group>"; };
                A6 /* InjectorViewController.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = InjectorViewController.h; sourceTree = "<group>"; };
                A7 /* InjectorViewController.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = InjectorViewController.m; sourceTree = "<group>"; };
                A8 /* LoginOverlayView.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = LoginOverlayView.h; sourceTree = "<group>"; };
                A9 /* LoginOverlayView.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = LoginOverlayView.m; sourceTree = "<group>"; };
                A10 /* MCMInjector.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = MCMInjector.h; sourceTree = "<group>"; };
                A11 /* MCMInjector.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = MCMInjector.m; sourceTree = "<group>"; };
                A12 /* ObfSec.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = ObfSec.h; sourceTree = "<group>"; };
                A13 /* ObfSec.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = ObfSec.m; sourceTree = "<group>"; };
                A14 /* SecureHTTP.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = SecureHTTP.h; sourceTree = "<group>"; };
                A15 /* SecureHTTP.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = SecureHTTP.m; sourceTree = "<group>"; };
                A16 /* externopolo.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = externopolo.app; sourceTree = BUILT_PRODUCTS_DIR; };
        /* End PBXFileReference section */
        /* Begin PBXGroup section */
                B1 = {isa = PBXGroup; children = (B2, B3,); sourceTree = "<group>"; };
                B2 = {isa = PBXGroup; children = (A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15,); name = externopolo; sourceTree = "<group>"; };
                B3 = {isa = PBXGroup; children = (A16,); name = Products; sourceTree = "<group>"; };
        /* End PBXGroup section */
        /* Begin PBXNativeTarget section */
                C1 = {isa = PBXNativeTarget; buildConfigurationList = D1; buildPhases = (E1, E2,); buildRules = (); dependencies = (); name = externopolo; productName = externopolo; productReference = A16; productType = "com.apple.product-type.application"; };
        /* End PBXNativeTarget section */
        /* Begin PBXProject section */
                F1 = {isa = PBXProject; attributes = {LastUpgradeCheck = 1200;}; buildConfigurationList = G1; compatibilityVersion = "Xcode 3.2"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = B1; productRefGroup = B3; projectDirPath = ""; projectRoot = ""; targets = (C1,); };
        /* End PBXProject section */
        /* Begin PBXSourcesBuildPhase section */
                E1 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (H1, H2, H3, H4, H5, H6, H7, H8,); runOnlyForDeploymentPostprocessing = 0; };
        /* End PBXSourcesBuildPhase section */
        /* Begin PBXFrameworksBuildPhase section */
                E2 = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
        /* End PBXFrameworksBuildPhase section */
        /* Begin PBXBuildFile section */
                H1 = {isa = PBXBuildFile; fileRef = A2; };
                H2 = {isa = PBXBuildFile; fileRef = A3; };
                H3 = {isa = PBXBuildFile; fileRef = A5; };
                H4 = {isa = PBXBuildFile; fileRef = A7; };
                H5 = {isa = PBXBuildFile; fileRef = A9; };
                H6 = {isa = PBXBuildFile; fileRef = A11; };
                H7 = {isa = PBXBuildFile; fileRef = A13; };
                H8 = {isa = PBXBuildFile; fileRef = A15; };
        /* End PBXBuildFile section */
        /* Begin XCBuildConfiguration section */
                I1 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = "$(TARGET_NAME)"; INFOPLIST_FILE = "";}; name = Debug; };
                I2 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = "$(TARGET_NAME)"; INFOPLIST_FILE = "";}; name = Release; };
        /* End XCBuildConfiguration section */
        /* Begin XCConfigurationList section */
                D1 = {isa = XCConfigurationList; buildConfigurations = (I1, I2,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                G1 = {isa = XCConfigurationList; buildConfigurations = (I1, I2,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
        /* End XCConfigurationList section */
            };
            rootObject = F1;
        }
        EOF
        
        # Cria um scheme compartilhado
        cat > externopolo.xcodeproj/xcshareddata/xcschemes/externopolo.xcscheme << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <Scheme LastUpgradeVersion = "1200" version = "1.3">
           <BuildAction parallelizeBuildables = "YES" buildImplicitDependencies = "YES">
              <BuildActionEntries>
                 <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                    <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "C1" BuildableName = "externopolo.app" BlueprintName = "externopolo" ReferencedContainer = "container:externopolo.xcodeproj">
                    </BuildableReference>
                 </BuildActionEntry>
              </BuildActionEntries>
           </BuildAction>
           <LaunchAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
              <BuildableProductRunnable runnableDebuggingMode = "0">
                 <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "C1" BuildableName = "externopolo.app" BlueprintName = "externopolo" ReferencedContainer = "container:externopolo.xcodeproj">
                 </BuildableReference>
              </BuildableProductRunnable>
           </LaunchAction>
           <ProfileAction buildConfiguration = "Release" shouldUseLaunchSchemeArgsEnv = "YES" savedToolIdentifier = "" useCustomWorkingDirectory = "NO" debugDocumentVersioning = "YES">
              <BuildableProductRunnable runnableDebuggingMode = "0">
                 <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "C1" BuildableName = "externopolo.app" BlueprintName = "externopolo" ReferencedContainer = "container:externopolo.xcodeproj">
                 </BuildableReference>
              </BuildableProductRunnable>
           </ProfileAction>
           <AnalyzeAction buildConfiguration = "Debug">
           </AnalyzeAction>
           <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES">
           </ArchiveAction>
        </Scheme>
        EOF

    - name: Build and Archive (Unsigned)
      run: |
        # Compila para dispositivo genérico iOS, sem assinatura
        xcodebuild archive \
          -project externopolo.xcodeproj \
          -scheme externopolo \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/externopolo.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_ALLOWED=NO

    - name: Create Unsigned IPA
      run: |
        # Empacota o .app em um .ipa não assinado
        mkdir -p Payload
        cp -R build/externopolo.xcarchive/Products/Applications/externopolo.app Payload/
        zip -r externopolo-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: externopolo-unsigned-ipa
        path: externopolo-unsigned.ipa
